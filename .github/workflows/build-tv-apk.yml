name: build-tv-apk

# 从 .github/tv-assets.json 拉取 tv-app 源码（tar.gz）落到仓库，
# 再用 tv-app/build.sh 构建 APK，挂到 Release。失败也会把构建日志提交到 ci/build-tv.log 便于排查。

on:
  push:
    branches: [main]
    paths:
      - ".github/tv-assets.json"
      - ".github/workflows/build-tv-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取 tv-app 源码
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, tarfile, urllib.request
          root = pathlib.Path('.')
          spec = json.loads((root / '.github/tv-assets.json').read_text('utf-8'))
          tmp = root / '.tv-tmp'
          shutil.rmtree(tmp, ignore_errors=True)
          tmp.mkdir()
          for a in spec['assets']:
              f = tmp / 'pkg'
              print('GET', a['url'])
              req = urllib.request.Request(a['url'], headers={'User-Agent': 'ysplive-ci'})
              with urllib.request.urlopen(req, timeout=120) as r, open(f, 'wb') as out:
                  shutil.copyfileobj(r, out)
              sha = hashlib.sha256(f.read_bytes()).hexdigest()
              if a.get('sha256') and sha != a['sha256'].lower():
                  raise SystemExit(f'sha256 mismatch: {sha}')
              dest = root / a['path']
              shutil.rmtree(dest, ignore_errors=True)
              dest.mkdir(parents=True)
              with tarfile.open(f, 'r:gz') as tf:
                  for m in tf.getmembers():
                      parts = pathlib.PurePosixPath(m.name).parts
                      if not parts:
                          continue
                      target = dest.joinpath(*parts)
                      if m.isdir():
                          target.mkdir(parents=True, exist_ok=True)
                      elif m.isfile():
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with tf.extractfile(m) as src, open(target, 'wb') as o2:
                              shutil.copyfileobj(src, o2)
              print('extracted ->', dest)
          shutil.rmtree(tmp, ignore_errors=True)
          PY

      - name: 提交源码
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv-app
          if git diff --cached --quiet; then
            echo "tv-app 无变化"
          else
            git commit -m "chore: 同步 tv-app 源码 [skip ci]"
            git push
          fi

      - name: 构建 APK
        shell: bash
        run: |
          set -o pipefail
          cd tv-app
          bash build.sh 2>&1 | tee build.log

      - name: 记录构建日志
        if: always()
        shell: bash
        run: |
          mkdir -p ci
          {
            echo "# 最近一次 tv-apk 构建日志（run $GITHUB_RUN_NUMBER）"
            echo
            echo '```'
            tail -n 120 tv-app/build.log 2>/dev/null || echo "(无 build.log)"
            echo '```'
          } > ci/build-tv.log
          git add ci/build-tv.log
          if git diff --cached --quiet; then
            echo "日志无变化"
          else
            git commit -m "chore: tv-apk 构建日志 [skip ci]"
            git push
          fi

      - name: 发布到 Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NO: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          cd tv-app
          APK=$(ls ysplive-tv-v*.apk | head -1)
          TAG="tv-v${RUN_NO}-apk"
          printf '%s\n' \
            'ysplive TV · 安卓电视/手机端（独立版，Android 4.0+，API 14 起）' \
            '' \
            '- 不依赖 NAS：频道表、播放都在本地，原生 MediaPlayer 播 HLS，不用 hls.js/MSE' \
            '- 遥控：↑↓ 选台，←→ 上下台，OK 开/收左栏，返回收起，菜单“管理频道”' \
            '- 菜单里可：添加频道 / 导入 m3u 订阅 / 在线更新频道表 / 恢复内置' \
            '- 中文央视需自备源（央视频设备签名只有服务器版能做）；内置的是官方可直连示例源' \
            '' \
            '源码在仓库 tv-app/ 目录，构建：bash build.sh' > /tmp/notes.txt
          gh release create "$TAG" --title "ysplive TV APK ($TAG)" --notes-file /tmp/notes.txt "$APK" \
            || gh release upload "$TAG" "$APK" --clobber
